name: Update template

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository != 'RandomDevelopment/ci-fleet-config-template'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the adopter's default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Propose a template release update
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_UPDATER_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo 'Set TEMPLATE_UPDATER_TOKEN before enabling the updater.' >&2; exit 1; }
          gh auth setup-git
          git config user.name 'Template updater'
          git config user.email 'template-updater@users.noreply.github.com'
          python3 scripts/update_template.py
