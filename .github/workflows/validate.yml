name: Validate configuration

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: config-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hosted-validation:
    name: hosted-validation
    # Convenience only. Required-check and host policy need separate migration.
    if: ${{ vars.CI_FLEET_HOSTED_VALIDATION == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.state == 'open') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require independently pinned validator
        env:
          VALIDATOR: ${{ vars.CI_FLEET_VALIDATOR_REVISION }}
          SUITE: ${{ vars.CI_FLEET_SUITE_REVISION }}
        run: |
          [[ "$VALIDATOR" =~ ^[0-9a-f]{40}$ && "$VALIDATOR" != 0000000000000000000000000000000000000000 ]]
          [[ "$SUITE" =~ ^[0-9a-f]{40}$ && "$SUITE" != 0000000000000000000000000000000000000000 ]]

      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate

      - name: Check out trusted engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: RandomDevelopment/ci-fleet
          ref: ${{ vars.CI_FLEET_VALIDATOR_REVISION }}
          path: .ci-fleet-validator
          persist-credentials: false
          fetch-depth: 0

      - name: Check out trusted suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: RandomDevelopment/ci-fleet-config-template
          ref: ${{ vars.CI_FLEET_SUITE_REVISION }}
          path: .ci-fleet-suite
          persist-credentials: false
          fetch-depth: 0

      - name: Check out trusted executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: RandomDevelopment/ci-fleet
          ref: 689c7c00deb0eebcb25f2284334a9f7168a25575
          path: .ci-fleet-executor
          persist-credentials: false
          fetch-depth: 0

      - name: Install validation tools
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          sudo python3 -I "$GITHUB_WORKSPACE/.ci-fleet-executor/scripts/local_validation_executor.py" --prepare --disposable-host

      - name: Run complete local validation
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REPOSITORY: ${{ github.repository }}
          VALIDATOR: ${{ vars.CI_FLEET_VALIDATOR_REVISION }}
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          BASE="${BASE:-0000000000000000000000000000000000000000}"
          main="$SOURCE"
          title_args=()
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            main="$BASE"
            title_args+=(--pr-title "$PR_TITLE")
          fi
          sudo python3 -I "$GITHUB_WORKSPACE/.ci-fleet-suite/scripts/local_validate.py" \
            --repository "$GITHUB_WORKSPACE/candidate" --repository-name "$REPOSITORY" \
            --source "$SOURCE" --base "$BASE" --main "$main" \
            --policy-repository "$GITHUB_WORKSPACE/.ci-fleet-validator" --policy "$VALIDATOR" \
            --output "$RUNNER_TEMP/local-validation" "${title_args[@]}"

      - name: Show validation report
        if: always()
        run: |
          if sudo test -f "$RUNNER_TEMP/local-validation/result.json"; then
            sudo cat "$RUNNER_TEMP/local-validation/result.json"
          fi
